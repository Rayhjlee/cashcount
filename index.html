<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c4a6e">
<title>Sushi Umi Hornsby — App</title>

<!-- Auto-redirect after 2 seconds -->
<meta http-equiv="refresh" content="2;url=https://restaurant-mate.netlify.app/umi-hornsby">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: Inter, -apple-system, sans-serif;
  background: linear-gradient(145deg, #0c4a6e 0%, #0a3554 50%, #071f33 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: white;
  overflow: hidden;
}

.bg-circle {
  position: fixed;
  border-radius: 50%;
  opacity: 0.06;
  pointer-events: none;
}
.bg-circle-1 {
  width: 400px; height: 400px;
  background: #38bdf8;
  top: -150px; right: -100px;
  animation: float 8s ease-in-out infinite;
}
.bg-circle-2 {
  width: 300px; height: 300px;
  background: #0ea5e9;
  bottom: -100px; left: -80px;
  animation: float 10s ease-in-out infinite reverse;
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
}

.card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 28px;
  padding: 40px 32px 36px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 20px 60px rgba(0, 0, 0, 0.4),
    0 4px 16px rgba(0, 0, 0, 0.3);
  animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.logo {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #e0f2fe, #38bdf8);
  border-radius: 22px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: 0 8px 32px rgba(56, 189, 248, 0.4);
  animation: logoAppear 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes logoAppear {
  from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

.store-name {
  font-size: 11px;
  font-weight: 700;
  color: #7dd3fc;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 6px;
  animation: fadeIn 0.5s 0.3s both;
}
.title {
  font-size: 22px;
  font-weight: 900;
  color: white;
  letter-spacing: -0.5px;
  margin-bottom: 24px;
  animation: fadeIn 0.5s 0.35s both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.redirect-box {
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 20px;
  animation: fadeIn 0.5s 0.45s both;
}
.redirect-label {
  font-size: 12px;
  color: #7dd3fc;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.redirect-arrow {
  font-size: 32px;
  animation: bounce 1s ease-in-out infinite;
  display: block;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-6px); }
}

.progress-wrap {
  background: rgba(255,255,255,0.1);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
  margin-bottom: 20px;
  animation: fadeIn 0.5s 0.5s both;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #0ea5e9);
  border-radius: 99px;
  animation: progress 2s linear forwards;
}
@keyframes progress {
  from { width: 0%; }
  to   { width: 100%; }
}

.btn-now {
  display: block;
  width: 100%;
  padding: 15px 20px;
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  color: white;
  border: none;
  border-radius: 14px;
  font-family: Inter, sans-serif;
  font-size: 15px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  animation: fadeIn 0.5s 0.55s both;
  letter-spacing: -0.2px;
}
.btn-now:active {
  transform: scale(0.97);
  box-shadow: 0 2px 10px rgba(14, 165, 233, 0.3);
}

.aths-hint {
  margin-top: 16px;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.7;
  text-align: left;
  animation: fadeIn 0.5s 0.65s both;
}
.aths-hint .step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}
.aths-hint .step .num {
  width: 18px;
  height: 18px;
  background: rgba(56, 189, 248, 0.3);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 900;
  color: #7dd3fc;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.aths-hint .hint-title {
  font-size: 11px;
  font-weight: 800;
  color: #7dd3fc;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
</style>
</head>

<body>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>

  <div class="card">
    <div class="logo">🍣</div>
    <div class="store-name">Sushi Umi</div>
    <div class="title">We've moved to a new app</div>

    <div class="redirect-box">
      <div class="redirect-label">Taking you there now...</div>
      <span class="redirect-arrow">→</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <a class="btn-now" href="https://restaurant-mate.netlify.app/umi-hornsby">
      Open New App →
    </a>

    <div class="aths-hint">
      <div class="hint-title">📲 Add to Home Screen</div>
      <div class="step"><div class="num">1</div> Tap the <b>Share button</b> at the bottom of Safari</div>
      <div class="step"><div class="num">2</div> Select <b>"Add to Home Screen"</b></div>
      <div class="step"><div class="num">3</div> Opens like an app from now on ✓</div>
    </div>
  </div>

  <script>
    // Auto-redirect after 2 seconds (meta refresh as backup)
    setTimeout(function() {
      window.location.replace('https://restaurant-mate.netlify.app/umi-hornsby');
    }, 2000);
  </script>
</body>
</html>
